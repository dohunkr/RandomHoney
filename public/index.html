<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘 뭐 하지? — Game Roulette</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap');
:root{--bg:#090b14;--panel:#111525;--panel2:#171c31;--line:#28304c;--text:#f7f7fb;--muted:#9299b9;--pink:#ff4d8d;--yellow:#ffd166;--cyan:#51e5ff;--purple:#9370ff;--green:#51e69b}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% -10%,#30215d 0,#0b0d18 40%,var(--bg) 70%);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:1320px;margin:auto;padding:28px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--pink),#9a54ff);font-size:26px;box-shadow:0 7px 25px #ff4d8d44}.eyebrow{color:var(--pink);font-weight:900;font-size:12px;letter-spacing:2px}.brand h1{font-family:'Black Han Sans';font-size:25px;margin:3px 0}.sound{background:#171b2c;border:1px solid var(--line);padding:11px 15px;border-radius:12px;color:var(--muted)}.sound.on{color:var(--yellow);border-color:#806b36}.hero{text-align:center;padding:45px 0 28px}.hero h2{font-family:'Black Han Sans';font-size:clamp(36px,6vw,70px);line-height:1.05;margin:0 0 12px;background:linear-gradient(100deg,#fff,var(--yellow) 55%,var(--pink));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:1.6fr .9fr;gap:18px}.card{background:linear-gradient(145deg,#151a2cdd,#101323ee);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 60px #0005}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.card h3{margin:0;font-size:16px}.pill{font-size:11px;color:var(--cyan);background:#51e5ff16;border:1px solid #51e5ff3b;padding:5px 9px;border-radius:99px}.machine{height:335px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.machine:before{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,#ff4d8d20,transparent 67%);pointer-events:none}.reels{display:flex;gap:10px;margin:15px 0 25px}.reel{width:108px;height:122px;background:#080a12;border:3px solid #3a4161;border-radius:17px;display:grid;place-items:center;font-size:52px;box-shadow:inset 0 0 20px #000,0 8px 0 #070810;position:relative}.reel:after{content:'';position:absolute;left:0;right:0;height:2px;background:var(--pink);box-shadow:0 0 12px var(--pink)}.jackpot{font-family:'Black Han Sans';font-size:23px;letter-spacing:1px;color:var(--yellow);min-height:30px}.spin{background:linear-gradient(135deg,var(--pink),#b249f5);border-radius:13px;padding:14px 38px;font-weight:900;font-size:16px;box-shadow:0 7px 0 #7c245e,0 12px 28px #ff4d8d45;transition:.15s}.spin:active{transform:translateY(5px);box-shadow:0 2px 0 #7c245e}.spin:disabled{opacity:.7}.quick{display:flex;gap:8px;margin-top:15px}.quick button{background:#202740;border:1px solid var(--line);padding:8px 14px;border-radius:10px;color:var(--muted);font-size:12px}.result{margin-top:15px;padding:17px;border-radius:15px;background:#0d1020;border:1px solid #30395c;display:none}.result.show{display:block;animation:pop .4s}.result strong{font-size:22px;color:#fff}.result small{color:var(--green);display:block;margin-top:4px}.side .card{height:100%}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{flex:1;background:#1b2035;padding:10px 5px;border-radius:10px;color:var(--muted);font-size:12px}.tab.active{background:var(--pink);color:#fff;font-weight:900}.ladder{height:220px;display:flex;justify-content:space-around;position:relative;padding:10px 18px}.ladder:before{content:'';position:absolute;inset:10px 40px;background:repeating-linear-gradient(90deg,transparent 0 45px,#657096 45px 47px,transparent 47px 92px),repeating-linear-gradient(0deg,transparent 0 36px,#657096 36px 38px,transparent 38px 76px);opacity:.7}.ladder span{z-index:1;background:#272c46;border-radius:50%;width:27px;height:27px;text-align:center;line-height:27px;font-size:12px}.ladder-controls{display:flex;gap:8px}.ladder-controls button,.add{flex:1;background:#252c49;border:1px solid var(--line);padding:10px;border-radius:10px;font-weight:700}.ladder-controls button:first-child{background:var(--cyan);color:#08121a}.penguin{height:220px;display:grid;place-items:center;position:relative;background:linear-gradient(#172143,#10162d);border-radius:15px;overflow:hidden}.penguin:after{content:'❄  ❄     ❄  ❄';position:absolute;top:18px;color:#c9eaff88;letter-spacing:18px}.penguin-emoji{font-size:83px;z-index:1;animation:waddle 1.2s infinite}.ice{position:absolute;bottom:0;width:100%;height:34px;background:repeating-linear-gradient(130deg,#65d8f7 0 32px,#a7efff 32px 35px);opacity:.65}.penguin button{position:absolute;bottom:12px;z-index:2;background:#fff;color:#172143;padding:7px 17px;border-radius:9px;font-size:12px;font-weight:900}.history{margin-top:18px}.history-list{display:flex;gap:8px;flex-wrap:wrap}.history-item{font-size:12px;background:#1d2339;border-radius:9px;padding:8px 10px;color:#dce0f3}.library{margin-top:18px}.library-tools{display:flex;gap:10px;margin-bottom:12px}.library-tools input{flex:1;background:#0b0e1b;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:#fff;outline:0}.count{color:var(--muted);font-size:12px;align-self:center}.games{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow:auto}.game{background:#1b2136;border:1px solid #293151;border-radius:9px;padding:8px 10px;font-size:12px}.game.star{color:var(--yellow);border-color:#69592c}.game span{color:#ffc857;margin-right:3px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 17px;border-radius:99px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}@keyframes waddle{0%,100%{transform:rotate(-5deg) translateX(-3px)}50%{transform:rotate(5deg) translateX(3px)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:18px}.side .card{height:auto}.history,.library{grid-column:1/-1}}@media(max-width:560px){.app{padding:18px 14px}.hero{padding:35px 0 22px}.reel{width:80px;height:100px;font-size:40px}.side{display:block}.side .card{margin-bottom:18px}.top{align-items:flex-start}.brand h1{font-size:20px}}
</style>
</head>
<body>
<main class="app"><header class="top"><div class="brand"><div class="logo">🎰</div><div><div class="eyebrow">GAME ROULETTE</div><h1>오늘 뭐 하지?</h1></div></div><button class="sound" id="soundBtn">🔊 효과음 ON</button></header>
<section class="hero"><h2>오늘의 게임을<br>운명에게 맡겨!</h2><p>친구들과 함께 도파민을 충전할 시간 ✨</p></section>
<div class="layout"><section><div class="card machine"><div class="card-head" style="width:100%"><h3>🎰 운명의 슬롯</h3><span class="pill">1000+ GAMES</span></div><div class="reels"><div class="reel" id="r1">🎮</div><div class="reel" id="r2">🔥</div><div class="reel" id="r3">👾</div></div><div class="jackpot" id="status">READY?</div><button class="spin" id="spinBtn">게임 뽑기!</button><div class="quick"><button data-mode="star">⭐ 찜한 게임만</button><button data-mode="all">전체 게임</button><button id="clearHistory">기록 지우기</button></div></div><div class="result" id="result"><small>✨ 오늘의 운명은</small><strong id="winner">-</strong><small id="winnerMeta"></small></div><div class="card library"><div class="card-head"><h3>📚 게임 리스트</h3><span class="count" id="count"></span></div><div class="library-tools"><input id="search" placeholder="게임 검색 또는 직접 추가..."/><button class="add" id="addBtn">+ 추가</button></div><div class="games" id="games"></div></div></section>
<aside class="side"><div class="card"><div class="card-head"><h3>🪜 사다리 타기</h3><span class="pill">BONUS</span></div><div class="ladder"><span>1</span><span>2</span><span>3</span><span>4</span></div><div class="ladder-controls"><button id="ladderBtn">결과 확인</button><button id="shuffleLadder">섞기</button></div><div class="result" id="ladderResult"><strong id="ladderText">?</strong></div></div><div class="card"><div class="card-head"><h3>🐧 펭귄 크로스</h3><span class="pill">DODGE!</span></div><div class="penguin"><div class="penguin-emoji">🐧</div><div class="ice"></div><button id="penguinBtn">길 건너기 ▶</button></div><div class="result" id="penguinResult"><strong id="penguinText">-</strong></div></div><div class="card history"><div class="card-head"><h3>🕘 최근 결과</h3></div><div class="history-list" id="history"><span style="color:var(--muted);font-size:12px">아직 뽑은 게임이 없어요</span></div></div></aside></div></main><div class="toast" id="toast"></div>
<script>
const games=[['⭐','인슈라오디드'],['⭐','RuneScape: Dragonwilds'],['⭐','Valheim'],['⭐','Palworld'],['⭐','No Man’s Sky'],['⭐','Grounded'],['⭐','Grounded 2'],['⭐','Terraria'],['⭐','V Rising'],['⭐','Dune: Awakening'],['⭐','7 Days to Die'],['⭐','Subnautica'],['⭐','Sons of the Forest'],['⭐','Minecraft'],['⭐','Mount & Blade II: Bannerlord'],['⭐','Kingdom Come: Deliverance II'],['⭐','Skyrim'],['⭐','Cyberpunk 2077'],['⭐','The Witcher 3'],['⭐','Red Dead Redemption 2'],['⭐','GTA V'],['⭐','Assassin’s Creed Odyssey'],['⭐','Ghost of Tsushima'],['⭐','Marvel’s Spider-Man Remastered'],['⭐','Monster Hunter: World'],['⭐','Monster Hunter Wilds'],['⭐','Elden Ring'],['⭐','Hollow Knight: Silksong'],['⭐','Baldur’s Gate 3'],['⭐','Stardew Valley'],['⭐','Dyson Sphere Program'],['⭐','A Way Out'],['⭐','Sea of Thieves'],['⭐','Forza Horizon 5'],['⭐','Pokémon Legends: Arceus'],['⭐','The Legend of Zelda: Breath of the Wild'],['⭐','Hades II'],['⭐','Lies of P'],['⭐','Remnant II'],['⭐','Satisfactory'],['','Core Keeper'],['','Don’t Starve Together'],['','Project Zomboid'],['','Rust'],['','Raft'],['','Astroneer'],['','The Forest'],['','Conan Exiles'],['','ARK: Survival Ascended'],['','Icarus'],['','Green Hell'],['','Fallout 4'],['','Fallout: New Vegas'],['','The Elder Scrolls Online'],['','Starfield'],['','Mass Effect Legendary Edition'],['','Dragon Age: Inquisition'],['','Divinity: Original Sin 2'],['','Disco Elysium'],['','Outer Wilds'],['','Control'],['','Alan Wake 2'],['','Death Stranding'],['','God of War Ragnarök'],['','Stray'],['','Tomb Raider'],['','Deep Rock Galactic'],['','Helldivers 2'],['','Warframe'],['','Destiny 2'],['','Borderlands 3'],['','The Division 2'],['','Phasmophobia'],['','Lethal Company'],['','R.E.P.O.'],['','Left 4 Dead 2'],['','Dying Light 2'],['','State of Decay 2'],['','The Long Dark'],['','Frostpunk 2'],['','RimWorld'],['','Factorio'],['','Planet Zoo'],['','Cities: Skylines II'],['','House Flipper 2'],['','PowerWash Simulator'],['','PlateUp!'],['','It Takes Two'],['','Split Fiction'],['','Portal 2'],['','Human: Fall Flat'],['','Gang Beasts'],['','Party Animals'],['','Overcooked! 2'],['','Escape Simulator'],['','Diablo IV'],['','Path of Exile 2'],['','Vampire Survivors'],['','Brotato'],['','Balatro'],['','Slay the Spire 2'],['','Inscryption'],['','Cult of the Lamb'],['','Dead Cells'],['','Noita'],['','Tunic'],['','Final Fantasy VII Rebirth'],['','Persona 5 Royal'],['','Metaphor: ReFantazio'],['','NieR: Automata'],['','Black Myth: Wukong'],['','Crimson Desert'],['','Euro Truck Simulator 2'],['','BeamNG.drive'],['','SnowRunner'],['','Trackmania'],['','Garry’s Mod'],['','Teardown'],['','Scrap Mechanic'],['','Fortnite'],['','Valorant'],['','Counter-Strike 2'],['','DOOM Eternal'],['','The Finals'],['','Monster Hunter Rise'],['','Star Wars Jedi: Survivor'],['','Hogwarts Legacy'],['','The Sims 4'],['','Palia'],['','Coral Island'],['','Age of Empires IV'],['','Civilization VII'],['','Crusader Kings III']];
let mode='all', sound=true, rolling=false; const $=s=>document.querySelector(s); const icons=['🎮','🔥','👾','⚔️','🌟','🧙','🚀','💀','🐉','🏆'];
function tone(freq=440,dur=.1,type='sine'){if(!sound)return;const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type=type;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}
function render(){const q=$('#search').value.toLowerCase();let list=games.filter(g=>(mode==='all'||g[0])&&g[1].toLowerCase().includes(q));$('#count').textContent=`${list.length}개 표시 중`;$('#games').innerHTML=list.map(g=>`<div class="game ${g[0]?'star':''}">${g[0]?'<span>⭐</span>':''}${g[1]}</div>`).join('')}
function pick(){if(rolling)return;rolling=true;$('#spinBtn').disabled=true;$('#status').textContent='ROLLING...';let list=games.filter(g=>mode==='all'||g[0]);let ticks=0;const timer=setInterval(()=>{['#r1','#r2','#r3'].forEach((s,i)=>$(s).textContent=icons[Math.floor(Math.random()*icons.length)]);tone(220+ticks*12,.04,'square');if(++ticks>14){clearInterval(timer);let win=list[Math.floor(Math.random()*list.length)];$('#r1').textContent='🎉';$('#r2').textContent=win[0]||'🎮';$('#r3').textContent='🎉';$('#status').textContent='JACKPOT!';$('#winner').textContent=win[1];$('#winnerMeta').textContent=win[0]?'⭐ 오늘은 찜한 게임 중에서 뽑혔어요!':'오늘의 게임으로 결정!';$('#result').classList.add('show');let h=JSON.parse(localStorage.getItem('history')||'[]');h.unshift(win[1]);h=[...new Set(h)].slice(0,6);localStorage.setItem('history',JSON.stringify(h));renderHistory();tone(880,.25,'triangle');rolling=false;$('#spinBtn').disabled=false}},90)}
function renderHistory(){let h=JSON.parse(localStorage.getItem('history')||'[]');$('#history').innerHTML=h.length?h.map((x,i)=>`<span class="history-item">${i+1}. ${x}</span>`).join(''):'<span style="color:var(--muted);font-size:12px">아직 뽑은 게임이 없어요</span>'}
$('#spinBtn').onclick=pick;$('#search').oninput=render;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render();toast(mode==='star'?'찜한 게임만 모았어요 ⭐':'전체 게임으로 돌아왔어요')});$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'🔊 효과음 ON':'🔇 효과음 OFF';$('#soundBtn').classList.toggle('on',sound);if(sound)tone(660,.1)};$('#clearHistory').onclick=()=>{localStorage.removeItem('history');renderHistory();toast('최근 기록을 지웠어요')};$('#addBtn').onclick=()=>{let v=$('#search').value.trim();if(v&&!games.some(g=>g[1].toLowerCase()===v.toLowerCase())){games.unshift(['',v]);$('#search').value='';render();toast(`${v} 추가 완료!`)}};$('#ladderBtn').onclick=()=>{let n=Math.floor(Math.random()*4)+1;$('#ladderText').textContent=`${n}번 당첨!`;$('#ladderResult').classList.add('show');tone(520,.18)};$('#shuffleLadder').onclick=()=>{tone(300,.08);toast('사다리를 섞었어요!')};$('#penguinBtn').onclick=()=>{let win=Math.random()>.35;$('#penguinText').textContent=win?'무사히 건넜다! 🎉':'앗! 물에 빠졌다 💦';$('#penguinResult').classList.add('show');tone(win?760:160,.18,win?'triangle':'sawtooth')};function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1700)}render();renderHistory();
</script></body></html>
